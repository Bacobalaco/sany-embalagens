name: Fix A4 report printing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix report print function
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.jsx')
          s = p.read_text(encoding='utf-8')
          old = "function printReport(){document.body.classList.add('report-print-mode');const cleanup=()=>{document.body.classList.remove('report-print-mode');window.removeEventListener('afterprint',cleanup)};window.addEventListener('afterprint',cleanup,{once:true});setTimeout(()=>window.print(),100)}"
          new = "function printReport(){const sheet=document.querySelector('.report-print-sheet');if(!sheet)return;const iframe=document.createElement('iframe');iframe.style.position='fixed';iframe.style.right='0';iframe.style.bottom='0';iframe.style.width='0';iframe.style.height='0';iframe.style.border='0';document.body.appendChild(iframe);const doc=iframe.contentDocument||iframe.contentWindow.document;doc.open();doc.write(`<!doctype html><html><head><title>Relatório SANY Embalagens</title><style>@page{size:A4 portrait;margin:12mm}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#111;font-family:Arial,sans-serif}.report-print-sheet{display:block!important;width:100%!important;background:#fff}.report-print-sheet h1{font-size:22px;margin:0 0 4px}.report-print-sheet .print-meta{font-size:11px;color:#555;margin-bottom:14px}.report-print-sheet .print-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}.report-print-sheet .print-box{border:1px solid #bbb;border-radius:6px;padding:8px}.report-print-sheet .print-box small{display:block;font-size:9px;color:#555}.report-print-sheet .print-box strong{display:block;font-size:14px;margin-top:3px}.report-print-sheet table{width:100%;border-collapse:collapse;font-size:9px}.report-print-sheet th,.report-print-sheet td{border:1px solid #ccc;padding:5px;text-align:left}.report-print-sheet th{font-weight:700;background:#f2f2f2}.report-print-sheet td:nth-child(5){text-align:right}.report-print-sheet .print-total{margin-top:12px;text-align:right;font-size:13px;font-weight:800}</style></head><body>${sheet.outerHTML}</body></html>`);doc.close();const doPrint=()=>{iframe.contentWindow.focus();iframe.contentWindow.print();setTimeout(()=>iframe.remove(),1000)};if(doc.readyState==='complete')setTimeout(doPrint,100);else iframe.onload=()=>setTimeout(doPrint,100)}"
          if old not in s:
              raise SystemExit('Target printReport function not found; no changes made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix A4 report print preview"
          git push