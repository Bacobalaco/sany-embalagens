name: Fix JSX syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix CustomerStatusList JSX syntax'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix CustomerStatusList
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.jsx')
          s=p.read_text()
          start=s.index('function CustomerStatusList')
          end=s.index('function InlineReceipt', start)
          segment=s[start:end]
          if '</div>}' not in segment:
              raise SystemExit('unexpected CustomerStatusList structure')
          # The outer customer-status-list div is missing its closing tag.
          segment=segment.rsplit('\n}', 1)[0] + '\n</div>}\n'
          s=s[:start]+segment+s[end:]
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.jsx
          git commit -m "Fix CustomerStatusList JSX syntax"
          git push
