name: Increase network report readability

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enlarge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enlarge network report fonts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/relatorio-impressao/page.jsx')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '.network-report{width:100%;font-size:10px}': '.network-report{width:100%;font-size:12px}',
              '.network-title-row h1{font-size:17px': '.network-title-row h1{font-size:20px',
              '.subtitle{font-size:9px': '.subtitle{font-size:11px',
              '.period{font-size:9px}': '.period{font-size:11px}',
              '.matrix th,.matrix td{border:1px solid #222;height:27px;padding:3px 5px}': '.matrix th,.matrix td{border:1px solid #222;height:31px;padding:4px 6px}',
              '.matrix th{background:#fff;font-weight:700;text-align:right;white-space:nowrap}': '.matrix th{background:#fff;font-weight:700;text-align:right;white-space:nowrap;font-size:12px}',
              '.matrix td{background:#f4f4f4;text-align:right;white-space:nowrap}': '.matrix td{background:#f4f4f4;text-align:right;white-space:nowrap;font-size:12px}',
              '.matrix td.customer-name{background:#86dc91;text-align:left;font-weight:700}': '.matrix td.customer-name{background:#86dc91;text-align:left;font-weight:700;font-size:12px}',
              '.matrix .total-row td{background:#fff21a;font-weight:800}': '.matrix .total-row td{background:#fff21a;font-weight:800;font-size:12px}',
              '.network-footer{display:flex;justify-content:space-between;align-items:center;margin-top:5px;font-size:10px}': '.network-footer{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:12px}',
              '.network-footer span{font-size:8px}': '.network-footer span{font-size:10px}',
              '@media print{.network-report{font-size:9px}.matrix th,.matrix td{height:25px}': '@media print{.network-report{font-size:12px}.matrix th,.matrix td{height:31px}.matrix th,.matrix td,.matrix td.customer-name,.matrix .total-row td{font-size:12px}'
          }
          changed = 0
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
                  changed += 1
          if changed:
              p.write_text(s, encoding='utf-8')
              print(f'Updated {changed} readability rules.')
          else:
              print('No changes needed.')
          PY

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/relatorio-impressao/page.jsx .github/workflows/one-time-enlarge-network-report.yml
          git rm .github/workflows/one-time-enlarge-network-report.yml
          git diff --cached --quiet && exit 0
          git commit -m "Increase network report font size"
          git push
