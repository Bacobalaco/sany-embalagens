name: Fix combined launch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix combined launch automatically'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix createLaunch event handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.jsx')
          s = p.read_text()
          old = 'async function createLaunch(shouldPrint){e.preventDefault();'
          new = 'async function createLaunch(shouldPrint){'
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.jsx
          git commit -m "Fix combined launch automatically"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git pull --rebase || true
          if [ -f .github/workflows/fix-combined-launch.yml ]; then
            git rm .github/workflows/fix-combined-launch.yml
            git commit -m "Remove temporary launch fix workflow" || true
            git push || true
          fi
