name: Increase A4 report print readability

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enlarge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enlarge A4 report print and enable customer credit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.jsx')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '@page{size:A4 portrait;margin:12mm}': '@page{size:A4 portrait;margin:8mm}',
              '.report-print-sheet h1{font-size:22px;margin:0 0 4px}': '.report-print-sheet h1{font-size:28px;margin:0 0 6px}',
              '.report-print-sheet .print-meta{font-size:11px;color:#555;margin-bottom:14px}': '.report-print-sheet .print-meta{font-size:13px;color:#555;margin-bottom:16px}',
              '.report-print-sheet .print-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}': '.report-print-sheet .print-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}',
              '.report-print-sheet .print-box{border:1px solid #bbb;border-radius:6px;padding:8px}': '.report-print-sheet .print-box{border:1px solid #bbb;border-radius:6px;padding:10px}',
              '.report-print-sheet .print-box small{display:block;font-size:9px;color:#555}': '.report-print-sheet .print-box small{display:block;font-size:11px;color:#555}',
              '.report-print-sheet .print-box strong{display:block;font-size:14px;margin-top:3px}': '.report-print-sheet .print-box strong{display:block;font-size:17px;margin-top:4px}',
              '.report-print-sheet table{width:100%;border-collapse:collapse;font-size:9px}': '.report-print-sheet table{width:100%;border-collapse:collapse;font-size:11px}',
              '.report-print-sheet th,.report-print-sheet td{border:1px solid #ccc;padding:5px;text-align:left}': '.report-print-sheet th,.report-print-sheet td{border:1px solid #ccc;padding:7px;text-align:left}',
              '.report-print-sheet .print-total{margin-top:12px;text-align:right;font-size:13px;font-weight:800}': '.report-print-sheet .print-total{margin-top:14px;text-align:right;font-size:16px;font-weight:800}',
              "if(paid>purchase){setError('O pagamento não pode ser maior que o valor da compra.');return}": '',
              '<div className="launch-preview"><strong>Saldo desta operação: {money(Math.max(0,Number(form.amount||0)-Number(form.payment_amount||0)))}</strong></div>': '<div className="launch-preview"><strong>{Number(form.amount||0)-Number(form.payment_amount||0)<0?`Crédito do cliente: ${money(Math.abs(Number(form.amount||0)-Number(form.payment_amount||0)))}`:`Saldo desta operação: ${money(Number(form.amount||0)-Number(form.payment_amount||0))}`}</strong></div>',
              '<div className="summary-row balance-row"><strong>DEVE</strong><span><b>R$</b><strong>{moneyNumber(balance)}</strong></span></div>': '<div className="summary-row balance-row"><strong>{balance<0?\'CRÉDITO\':\'DEVE\'}</strong><span><b>R$</b><strong>{moneyNumber(Math.abs(balance))}</strong></span></div>'
          }
          changed = 0
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
                  changed += 1
          if changed == 0:
              print('No changes needed; all requested rules are already applied.')
              raise SystemExit(0)
          p.write_text(s, encoding='utf-8')
          print(f'Updated {changed} rules.')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Allow overpayments as customer credit"
          git push
